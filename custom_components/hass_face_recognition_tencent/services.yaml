face_search:
  fields:
    group_id:
      required: false
      example: "Hass"
      selector:
        text:
    image_url:
      required: false
      example: "https://example.com/image.jpg"
      selector:
        text:
    image_path:
      required: false
      example: "/config/www/image.jpg"
      selector:
        text:
    image_file:
      required: false
      selector:
        text:
    camera_entity_id:
      required: false
      example: "camera.front_door"
      selector:
        entity:
          filter:
            domain: camera
    config_entry_id:
      required: false
      selector:
        text:
    max_face_num:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    min_face_size:
      required: false
      default: 34
      selector:
        number:
          min: 20
          max: 4096
          step: 1
          mode: box
    max_user_num:
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    quality_control:
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: box
    need_rotate_check:
      required: false
      default: 1
      selector:
        select:
          options:
            - label: "否"
              value: "0"
            - label: "是"
              value: "1"
    face_match_threshold:
      required: false
      default: 60.0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box


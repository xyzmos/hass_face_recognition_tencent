create_person:
  fields:
    person_id:
      required: true
      example: "person_001"
      selector:
        text:
    person_name:
      required: true
      example: "张三"
      selector:
        text:
    group_id:
      required: false
      example: "Hass"
      selector:
        text:
    image_url:
      required: false
      example: "https://example.com/face.jpg"
      selector:
        text:
    image_path:
      required: false
      example: "/config/www/face.jpg"
      selector:
        text:
    image_file:
      required: false
      selector:
        text:
    camera_entity_id:
      required: false
      example: "camera.front_door"
      selector:
        entity:
          filter:
            domain: camera
    config_entry_id:
      required: false
      selector:
        text:
    gender:
      required: false
      selector:
        select:
          options:
            - label: "女"
              value: "0"
            - label: "男"
              value: "1"
            - label: "未知"
              value: "2"
    person_tag:
      required: false
      selector:
        text:
    quality_control:
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: box
    need_rotate_check:
      required: false
      default: 1
      selector:
        select:
          options:
            - label: "否"
              value: "0"
            - label: "是"
              value: "1"
    unique_person_control:
      required: false
      selector:
        select:
          options:
            - label: "不查重"
              value: "0"
            - label: "查重"
              value: "1"
            - label: "全局查重"
              value: "2"
            - label: "全局拒绝"
              value: "3"
            - label: "自定义"
              value: "4"


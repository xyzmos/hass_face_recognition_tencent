name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v2.3.4）；留空则取最新 tag"
        required: false
        default: ""

permissions:
  contents: write

env:
  DOMAIN_DIR: custom_components/hass_face_recognition_tencent
  ZIP_NAME: hass_face_recognition_tencent.zip

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag & version
        id: ver
        run: |
          set -e
          # 手动触发：用输入 tag（留空取最新 tag）；push tag：用 GITHUB_REF_NAME
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG=$(git tag --sort=-v:refname | head -1)
          [ "$GITHUB_EVENT_NAME" = "push" ] && TAG="${GITHUB_REF_NAME}"
          [ -z "$TAG" ] && { echo "::error::无法确定 tag"; exit 1; }
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved tag=$TAG version=$VERSION"

      - name: Ensure tag exists on origin
        run: |
          set -e
          # push 事件 tag 已在；workflow_dispatch 且 tag 不在远端时补建（指向 main 最新）
          if ! git rev-parse "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${{ steps.ver.outputs.tag }}" origin/main
            git push origin "${{ steps.ver.outputs.tag }}"
            echo "::notice::已在远端补建 tag ${{ steps.ver.outputs.tag }}（指向 main）"
          fi
          git fetch --tags origin
          git checkout "${{ steps.ver.outputs.tag }}" 2>/dev/null || true

      - name: Sync manifest version to tag
        run: |
          set -e
          M="$DOMAIN_DIR/manifest.json"
          V="${{ steps.ver.outputs.version }}"
          MVER=$(python3 -c "import json;print(json.load(open('$M'))['version'])")
          if [ "$MVER" != "$V" ]; then
            echo "::notice::manifest($MVER) -> tag($V)（仅影响本次打包产物）"
            python3 -c "import json;p='$M';d=json.load(open(p));d['version']='$V';json.dump(d,open(p,'w'),ensure_ascii=False,indent=2);open(p,'a').write('\n')"
          fi

      - name: Build integration zip
        run: |
          set -e
          cd "$DOMAIN_DIR"
          zip -r "../../$ZIP_NAME" . -x "__pycache__/*" -x "*.pyc"
          cd ../..
          ls -lh "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | grep -q "manifest.json" || { echo "::error::zip 根缺少 manifest.json"; exit 1; }
          unzip -l "$ZIP_NAME" | grep -q "brand/icon.png" && echo "OK: brand 图标已包含"

      - name: Generate changelog
        id: cl
        run: |
          set -e
          CUR="${{ steps.ver.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${CUR}$" | head -1 || true)
          RANGE=$([ -n "$PREV" ] && echo "${PREV}..${CUR}" || echo "${CUR}")
          {
            echo "### 变更内容"
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges || echo "- 详见提交记录"
          } > changelog.md
          cat changelog.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Release ${{ steps.ver.outputs.tag }}" \
            --notes-file changelog.md \
            --latest \
            "$ZIP_NAME"
          echo "::notice::release ${{ steps.ver.outputs.tag }} 已创建并上传 $ZIP_NAME"

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v2.3.3，默认取最新 tag）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 手动触发时 checkout 指定 tag，push tag 时默认已是该 tag 提交
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve version and sync manifest
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          TAG="${TAG:-${{ github.event.inputs.tag }}}"
          VERSION="${TAG#v}"
          echo "tag=$TAG version=$VERSION"
          MANIFEST="custom_components/hass_face_recognition_tencent/manifest.json"
          MVER=$(python3 -c "import json;print(json.load(open('$MANIFEST'))['version'])")
          echo "manifest version=$MVER"
          # 不一致时自动把 manifest 版本改为 tag 版本（仅影响本次打包产物，不回写仓库）
          if [ "$MVER" != "$VERSION" ]; then
            echo "::notice::manifest($MVER) != tag($VERSION)，已将 zip 内 manifest 同步为 $VERSION"
            python3 -c "import json,sys;p,v=sys.argv[1],sys.argv[2];d=json.load(open(p));d['version']=v;json.dump(d,open(p,'w'),ensure_ascii=False,indent=2);open(p,'a').write('\n')" "$MANIFEST" "$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build integration zip
        run: |
          set -e
          # HACS zip_release 期望 zip 根目录即文件本体（manifest.json 在根），
          # 解压到 custom_components/<domain>/ 后即 manifest.json 就位
          cd "custom_components/hass_face_recognition_tencent"
          zip -r "../../hass_face_recognition_tencent.zip" . \
            -x "__pycache__/*" -x "*.pyc"
          cd ../..
          ls -lh hass_face_recognition_tencent.zip
          # 校验 zip 根必须含 manifest.json，且 brand 图标已打入
          unzip -l hass_face_recognition_tencent.zip | grep -q "manifest.json" \
            && echo "OK: manifest.json in zip root" || { echo "::error::zip 根目录缺少 manifest.json"; exit 1; }
          unzip -l hass_face_recognition_tencent.zip | grep -q "brand/icon.png" \
            && echo "OK: brand/icon.png included" || echo "::warning::brand/icon.png 未打入 zip"
          echo "ASSET=hass_face_recognition_tencent.zip" >> "$GITHUB_ENV"

      - name: Generate changelog
        id: changelog
        run: |
          set -e
          CUR="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${CUR}$" | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${CUR}"; else RANGE="${CUR}"; fi
          {
            echo "### 变更内容"
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges || echo "- 详见提交记录"
          } > changelog.md
          cat changelog.md

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          tag  = os.environ["GITHUB_REF_NAME"] or "${{ github.event.inputs.tag }}"
          ver  = os.environ.get("VERSION", tag.lstrip("v"))
          token= os.environ["GH_TOKEN"]
          asset= os.environ.get("ASSET", "hass_face_recognition_tencent.zip")
          body = open("changelog.md", encoding="utf-8").read()

          def req(method, url, data=None, raw=False, extra=None):
              r = urllib.request.Request(url, method=method, data=data)
              r.add_header("Authorization", f"Bearer {token}")
              r.add_header("Accept", "application/vnd.github+json")
              if extra: [r.add_header(k, v) for k, v in extra.items()]
              if data is not None and not raw:
                  r.add_header("Content-Type", "application/json")
              return urllib.request.urlopen(r)

          # 1. 创建 release（GitHub 与 Gitea API 均兼容）
          payload = {"tag_name": tag, "name": f"Release {tag}",
                     "body": body, "draft": False, "prerelease": False}
          resp = req("POST", f"{api}/repos/{repo}/releases",
                     data=json.dumps(payload).encode())
          rel = json.loads(resp.read().decode())
          upload_url = rel.get("upload_url", "")
          upload_url = upload_url.split("{")[0]
          print("release created:", rel.get("html_url") or rel.get("id"))

          # 2. 上传 zip 资产
          with open(asset, "rb") as f:
              data = f.read()
          q = urllib.parse.urlencode({"name": asset})
          up = req("POST", f"{upload_url}?{q}", data=data, raw=True,
                   extra={"Content-Type": "application/zip"})
          print("asset uploaded:", asset)
          PY

      - name: Done
        run: echo "Release ${GITHUB_REF_NAME} 已发布并附带 ${ASSET}"

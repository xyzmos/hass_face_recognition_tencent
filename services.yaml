        text:
    image_path:
      name: 图片路径
      description: 要分析的本地图片路径。
      example: "/config/www/image.jpg"
      selector:
        text:
    image_file:
      name: 图片文件
      description: 要分析的图片文件（Base64编码）。
      selector:
        text:
    camera_entity_id:
      name: 摄像头实体
      description: 用于获取图片的摄像头实体ID。
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    config_entry_id:
      name: 配置项ID
      description: 使用的配置项ID（多配置时指定）。
      selector:
        text:
    max_face_num:
      name: 最大人脸数量
      description: 最多分析的人脸数量。
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    need_rotate_check:
      name: 旋转检查
      description: 是否进行旋转检查（0=否，1=是）。

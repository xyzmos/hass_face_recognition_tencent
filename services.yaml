# 腾讯云人脸识别服务定义
face_search:
  name: 人脸搜索
  description: 在指定的人员库中搜索人脸。
  fields:
    group_id:
      name: 人员库ID
      description: 人员库 ID。
      required: true
      example: "Hass"
      selector:
        text:
    image_url:
      name: 图片URL
      description: 要搜索的人脸图片的 URL。
      example: "https://example.com/image.jpg"
      selector:
        text:
    image_path:
      name: 图片路径
      description: Home Assistant 本地可访问的人脸图片路径。
      example: "/config/www/image.jpg"
      selector:
        text:
    image_file:
      name: 图片文件
      description: 通过文件上传的人脸图片。
      selector:
        text:
    max_face_num:
      name: 最大人脸数量
      description: 最多处理的人脸数量。
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    min_face_size:
      name: 最小人脸尺寸
      description: 最小人脸尺寸（像素）。
      default: 34
      example: 34
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box
    max_user_num:
      name: 最大返回人员数量
      description: 最多返回的匹配人员数量。
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: box
    quality_control:
      name: 质量控制
      description: 是否进行质量控制。
      default: true
      example: 1
      selector:
        number:
          min: 0
          max: 1
          mode: box
    need_rotate_check:
      name: 旋转检查
      description: 是否进行旋转检查。
      default: true
      example: true
      selector:
        boolean:
    face_match_threshold:
      name: 人脸匹配阈值
      description: 人脸匹配阈值（0-100）。
      default: 60
      example: 60
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
  response:
    description: "人脸搜索结果"
    fields:
      results:
        name: "结果"
        description: "包含人脸ID和候选人列表的数组"
        example: '[{"face_id": "3440118425101275818", "candidates": [{"person_id": "person_1", "person_name": "张三", "score": 99.9, "person_tag": "员工"}]}]'

detect_face:
  name: 人脸检测
  description: 检测图片中的人脸。
  fields:
    image_url:
      name: 图片URL
      description: 要检测的图片URL。
      example: "https://example.com/image.jpg"
      selector:
        text:
    image_path:
      name: 图片路径
      description: 要检测的本地图片路径。
      example: "/config/www/image.jpg"
      selector:
        text:
    image_file:
      name: 图片文件
      description: 要检测的图片文件。
      selector:
        text:
    max_face_num:
      name: 最大人脸数量
      description: 最多检测的人脸数量。
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    min_face_size:
      name: 最小人脸尺寸
      description: 最小人脸尺寸（像素）。
      default: 34
      example: 34
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box
    need_rotate_check:
      name: 旋转检查
      description: 是否进行旋转检查。
      default: true
      example: true
      selector:
        boolean:

get_face_attributes:
  name: 获取人脸属性
  description: 获取图片中人脸的属性信息。
  fields:
    image_url:
      name: 图片URL
      description: 要分析的图片URL。
      example: "https://example.com/image.jpg"
      selector:
        text:
    image_path:
      name: 图片路径
      description: 要分析的本地图片路径。
      example: "/config/www/image.jpg"
      selector:
        text:
    image_file:
      name: 图片文件
      description: 要分析的图片文件。
      selector:
        text:
    max_face_num:
      name: 最大人脸数量
      description: 最多分析的人脸数量。
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    need_rotate_check:
      name: 旋转检查
      description: 是否进行旋转检查。
      default: true
      example: true
      selector:
        boolean:
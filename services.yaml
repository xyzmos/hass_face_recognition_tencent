face_search:
  name: 人脸搜索
  description: 在指定的人员库中搜索人脸。
  fields:
    group_id:
      name: 人员库ID
      description: 人员库 ID。
      required: true
      example: "Hass"
      selector:
        text:
    image_url:
      name: 图片URL
      description: 要搜索的人脸图片的 URL。
      example: "https://example.com/image.jpg"
      selector:
        text:
    image_path:
      name: 图片路径
      description: Home Assistant 本地可访问的人脸图片路径。
      example: "/config/www/image.jpg"
      selector:
        text:
    image_file:
      name: 图片文件
      description: 通过文件上传的人脸图片（Base64编码）。
      selector:
        text:
    camera_entity_id:
      name: 摄像头实体
      description: 用于获取图片的摄像头实体ID。
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    config_entry_id:
      name: 配置项ID
      description: 使用的配置项ID（多配置时指定）。
      selector:
        text:
    max_face_num:
      name: 最大人脸数量
      description: 最多处理的人脸数量。
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    min_face_size:
      name: 最小人脸尺寸
      description: 最小人脸尺寸（像素）。
      default: 34
      example: 34
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box
    max_user_num:
      name: 最大返回人员数量
      description: 最多返回的匹配人员数量。
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: box
    quality_control:
      name: 质量控制
      description: 是否进行质量控制（0=否，1=是）。
      default: 1
      example: 1
      selector:
        select:
          options:
            - label: "否"
              value: "0"
            - label: "是"
              value: "1"


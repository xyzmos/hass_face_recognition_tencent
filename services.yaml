create_person:
  name: 创建人员
  description: 在人员库中创建新人员。
  fields:
    person_id:
      name: 人员ID
      description: 人员的唯一标识符。
      required: true
      example: "person_001"
      selector:
        text:
    person_name:
      name: 人员名称
      description: 人员名称。
      required: true
      example: "张三"
      selector:
        text:
    group_id:
      name: 人员库ID
      description: 要添加到的人员库ID。
      required: true
      example: "Hass"
      selector:
        text:
    image_url:
      name: 图片URL
      description: 人员人脸图片URL。
      example: "https://example.com/face.jpg"
      selector:
        text:
    image_path:
      name: 图片路径
      description: 人员人脸本地图片路径。
      example: "/config/www/face.jpg"
      selector:
        text:
    image_file:
      name: 图片文件
      description: 人员人脸图片文件（Base64编码）。
      selector:
        text:
    camera_entity_id:
      name: 摄像头实体
      description: 用于获取人脸图片的摄像头实体ID。
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    config_entry_id:
      name: 配置项ID
      description: 使用的配置项ID（多配置时指定）。
      selector:
        text:
    gender:
      name: 性别
      description: 性别（0=女，1=男）。
      selector:
        select:
          options:
            - label: "女"
              value: "0"
            - label: "男"
              value: "1"
    person_tag:
      name: 人员标签
      description: 人员备注标签。
      selector:
        text:
    quality_control:
      name: 质量控制
      description: 是否进行质量控制（0=否，1=是）。
      default: 1
      selector:
        select:
          options:
            - label: "否"
              value: "0"
            - label: "是"
              value: "1"
    need_rotate_check:
      name: 旋转检查
      description: 是否进行旋转检查（0=否，1=是）。
      default: 1
      selector:
        select:
          options:
            - label: "否"
              value: "0"
            - label: "是"
              value: "1"

